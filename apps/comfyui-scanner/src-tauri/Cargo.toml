[package]
name = "comfyui-scanner"
version = "0.1.0"
description = "Scanner de instalações do ComfyUI"
authors = ["ComfyUI Scanner"]
edition = "2021"

[lib]
name = "comfyui_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = ["devtools"] }
tauri-plugin-dialog = "2"
walkdir = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

[profile.dev]
split-debuginfo = "unpacked"
incremental = false
