[package]
name = "pdf-collection-viewer"
version = "0.1.0"
description = "Biblioteca visual de arquivos organizada por coleções"
authors = ["PDF Collection Viewer"]
edition = "2021"

[lib]
name = "pdf_collection_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", features = ["webp"] }
pdfium-render = { version = "0.8" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
trash = "5"
walkdir = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

[profile.dev]
split-debuginfo = "unpacked"
incremental = false
