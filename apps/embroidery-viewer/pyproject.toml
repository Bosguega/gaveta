[project]
name = "embroidery-viewer-py"
version = "0.1.0"
description = "Backend Python do embroidery-viewer: integração pyembroidery"
requires-python = ">=3.10"

[project.scripts]
embroidery-reader = "reader:main"

[tool.pytest.ini_options]
pythonpath = ["src-tauri/py"]
testpaths = ["tests"]

[tool.pylint.main]
ignore = ["tests"]
