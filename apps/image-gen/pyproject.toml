[project]
name = "image-gen"
version = "0.1.0"
description = "Local image generation server based on Hugging Face Diffusers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "diffusers>=0.32",
    "transformers>=4.46",
    "accelerate>=1.1",
    "safetensors>=0.4",
    "torch>=2.6",
    "torchvision>=0.21",
    "pillow>=11.0",
    "psutil>=7.2.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools]
packages = ["src"]
