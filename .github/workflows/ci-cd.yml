name: CI/CD Pipeline (my_mercado)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check (shared package)
        run: pnpm --filter @bosguega/gaveta-de-bagunca build

      - name: Type Check (app)
        run: pnpm --filter my_mercado typecheck

      - name: Lint
        run: pnpm --filter my_mercado lint

      - name: Test
        run: pnpm --filter my_mercado test:run
        env:
          CI: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    environment: github-pages
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package (gaveta-de-bagunca)
        run: pnpm --filter @bosguega/gaveta-de-bagunca build

      - name: Build app (my_mercado)
        run: pnpm --filter my_mercado build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/my_mercado/dist